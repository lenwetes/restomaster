services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sushixpress-app:latest
    container_name: sushixpress_app
    restart: unless-stopped
    ports:
      - "8004:80"
    environment:
      APP_NAME: "${APP_NAME:-SushiXpress}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8004}"
      LOG_CHANNEL: stack
      LOG_LEVEL: info

      # Database Configuration
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-sushixpress}"
      DB_USERNAME: "${DB_USERNAME:-sushixpress_user}"
      DB_PASSWORD: "${DB_PASSWORD:-sushixpress_secure_password}"

      # Drivers
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      QUEUE_CONNECTION: database
      CACHE_STORE: database

      # Automation on container boot
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      AUTO_SEED: "${AUTO_SEED:-true}"
      DEMO_USERS_PASSWORD: "${DEMO_USERS_PASSWORD:-sushixpress2026}"
      OPTIMIZE_CACHE: "${OPTIMIZE_CACHE:-true}"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sushixpress_net
    labels:
      - "coolify.managed=true"

  postgres:
    image: postgres:17-alpine
    container_name: sushixpress_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-sushixpress}"
      POSTGRES_USER: "${DB_USERNAME:-sushixpress_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-sushixpress_secure_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sushixpress_user} -d ${DB_DATABASE:-sushixpress}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sushixpress_net

volumes:
  postgres_data:
    driver: local
  storage_app:
    driver: local
  storage_logs:
    driver: local

networks:
  sushixpress_net:
    driver: bridge
