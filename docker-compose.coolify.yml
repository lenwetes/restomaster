# ==============================================================================
# RestoMaster — Docker Compose para Producción y DEMOS (cero-fricción) en Coolify
# ==============================================================================
# Compatible con despliegue en Coolify (Docker Compose con proxy Traefik/Caddy
# o mapeo directo de puertos). Cero fricción, arranque autónomo con migraciones
# y soporte completo de WebSockets (Laravel Reverb) en el puerto HTTP/HTTPS.
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: restomaster-app:latest
    restart: unless-stopped
    labels:
      - "coolify.managed=true"
    expose:
      - "80"
    ports:
      - "${APP_PORT:-8004}:80"
    environment:
      APP_NAME: "${APP_NAME:-RestoMaster}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:oLXrwloTI0QaICwHbIcV6HuJkMz9uqsOvThnVMkLBcw=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8004}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      # Base de datos PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-restomaster}"
      DB_USERNAME: "${DB_USERNAME:-adminresto}"
      DB_PASSWORD: "${DB_PASSWORD:-RestoDemo2026DB}"

      # Sesión / cola / caché
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      # WebSockets en Tiempo Real (Laravel Reverb)
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-reverb}"
      REVERB_APP_ID: "${REVERB_APP_ID:-100001}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-restomaster-reverb-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-restomaster-reverb-secret}"
      REVERB_HOST: "${REVERB_HOST:-0.0.0.0}"
      REVERB_PORT: "${REVERB_PORT:-443}"
      REVERB_SCHEME: "${REVERB_SCHEME:-https}"

      # CRM & WhatsApp Business Cloud API
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
      WHATSAPP_SIMULADO: "${WHATSAPP_SIMULADO:-true}"

      # IA & LLM Provider (Google Gemini / OpenAI)
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

      # Social Auth (Google OAuth2)
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"

      # Monitoreo y Métricas en Servidor (Sentry & Tiempos p95 por Sucursal)
      SENTRY_LARAVEL_DSN: "${SENTRY_LARAVEL_DSN:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-1.0}"
      SENTRY_PROFILES_SAMPLE_RATE: "${SENTRY_PROFILES_SAMPLE_RATE:-0.5}"
      METRICAS_P95_ENABLED: "${METRICAS_P95_ENABLED:-true}"

      # Pasarelas de Pago (Wompi Bancolombia / Nequi & Bold Smart POS)
      WOMPI_PUBLIC_KEY: "${WOMPI_PUBLIC_KEY:-}"
      WOMPI_PRIVATE_KEY: "${WOMPI_PRIVATE_KEY:-}"
      WOMPI_INTEGRITY_SECRET: "${WOMPI_INTEGRITY_SECRET:-}"
      WOMPI_EVENTS_SECRET: "${WOMPI_EVENTS_SECRET:-}"
      WOMPI_SANDBOX: "${WOMPI_SANDBOX:-true}"
      BOLD_API_KEY: "${BOLD_API_KEY:-}"
      BOLD_SECRET_KEY: "${BOLD_SECRET_KEY:-}"

      # Facturación Electrónica DIAN POS con CUFE
      DIAN_PROVEEDOR: "${DIAN_PROVEEDOR:-simulador}"
      DIAN_ENDPOINT: "${DIAN_ENDPOINT:-}"
      DIAN_TOKEN: "${DIAN_TOKEN:-}"
      DIAN_CLAVE_TECNICA: "${DIAN_CLAVE_TECNICA:-}"
      DIAN_RESOLUCION_NUMERO: "${DIAN_RESOLUCION_NUMERO:-}"
      DIAN_PREFIJO: "${DIAN_PREFIJO:-POS}"

      # Backups Cloud (Cloudflare R2 / AWS S3)
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-auto}"
      AWS_BUCKET: "${AWS_BUCKET:-}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-}"

      # Correo Transaccional
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-no-reply@restomaster.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-RestoMaster}"

      # Automatización al arrancar el contenedor
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      AUTO_SEED: "${AUTO_SEED:-true}"
      AUTO_SEED_DEMO: "${AUTO_SEED_DEMO:-true}"
      DEMO_USERS_PASSWORD: "${DEMO_USERS_PASSWORD:-RestoDemo2026}"
      OPTIMIZE_CACHE: "${OPTIMIZE_CACHE:-true}"

      # Rendimiento PHP y Carga de Archivos
      PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-512M}"
      PHP_POST_MAX_SIZE: "${PHP_POST_MAX_SIZE:-64M}"
      PHP_UPLOAD_MAX_FILESIZE: "${PHP_UPLOAD_MAX_FILESIZE:-64M}"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-restomaster}"
      POSTGRES_USER: "${DB_USERNAME:-adminresto}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-RestoDemo2026DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_v18:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_v18:
  redis_data:
  storage_app:
  storage_logs:
