# ==============================================================================
# RestoMaster — Docker Compose para Coolify (y pruebas locales)
# ==============================================================================
# En Coolify: recurso "Docker Compose", rama main, archivo "docker-compose.yml".
# - El servicio app NO publica puertos: el proxy de Coolify enruta al puerto 80
#   (EXPOSE del Dockerfile). Publicar puertos host interfiere con Coolify.
# - Variables: se toman del entorno de Coolify (Environment) o de un .env local.
#   APP_KEY y DB_PASSWORD son obligatorias (falla rápido con mensaje claro).
# - La BD viaja en el servicio postgres con volumen persistente.
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: restomaster-app:latest
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: "${APP_NAME:-RestoMaster}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?APP_KEY debe estar definida en el entorno}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8004}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      # Base de datos PostgreSQL (servicio postgres de este mismo compose)
      DB_CONNECTION: pgsql
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-restomaster}"
      DB_USERNAME: "${DB_USERNAME:-adminresto}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD debe estar definida en el entorno}"

      # Sesión / cola / caché
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      CACHE_STORE: "${CACHE_STORE:-file}"

      # Automatización al arrancar el contenedor
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      AUTO_SEED: "${AUTO_SEED:-false}"
      DEMO_USERS_PASSWORD: "${DEMO_USERS_PASSWORD:-}"
      OPTIMIZE_CACHE: "${OPTIMIZE_CACHE:-true}"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-restomaster}"
      POSTGRES_USER: "${DB_USERNAME:-adminresto}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD debe estar definida en el entorno}"
    volumes:
      # PG18+: montaje en el padre (/var/lib/postgresql); la imagen gestiona
      # el subdirectorio versionado. Montar en .../data rompe el arranque.
      # Volumen nuevo (_v18) para no arrastrar restos incompatibles previos.
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      # Con password explícita (auth scram por TCP) + gracia amplia para initdb en discos lentos.
      # OJO: $$ escapa el $ para que Compose NO lo interpole y llegue literal al shell del contenedor.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  postgres_data_v18:
  storage_app:
  storage_logs:
