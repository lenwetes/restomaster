services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sushixpress-app:latest
    container_name: sushixpress_app
    restart: unless-stopped
    ports:
      - "8004:80"
    environment:
      APP_NAME: "${APP_NAME:-RestoMaster}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8004}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug

      # Database Configuration
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-restomaster}"
      DB_USERNAME: "${DB_USERNAME:-adminresto}"
      DB_PASSWORD: "${DB_PASSWORD}"

      # Drivers
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: 120
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      CACHE_STORE: "${CACHE_STORE:-file}"

      # Automation on container boot
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      AUTO_SEED: "${AUTO_SEED:-false}"
      DEMO_USERS_PASSWORD: "${DEMO_USERS_PASSWORD}"
      OPTIMIZE_CACHE: "${OPTIMIZE_CACHE:-true}"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restomaster_net
    labels:
      - "coolify.managed=true"

  postgres:
    image: postgres:17-alpine
    container_name: restomaster_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-127.0.0.1:5434}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-restomaster}"
      POSTGRES_USER: "${DB_USERNAME:-adminresto}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-adminresto} -d ${DB_DATABASE:-restomaster}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - restomaster_net

volumes:
  postgres_data:
    driver: local
  storage_app:
    driver: local
  storage_logs:
    driver: local

networks:
  restomaster_net:
    driver: bridge
