# ==============================================================================
# RestoMaster — Production & Staging Docker Compose for Coolify (.yaml extension)
# Compatible with Coolify v4+ and standalone Docker on VPS
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: restomaster-app:latest
    restart: unless-stopped
    expose:
      - "80"
    ports:
      # Puerto directo para pruebas en VPS vía http://IP_VPS:8004
      - "${APP_PORT:-8004}:80"
    environment:
      # Configuración de Aplicación
      APP_NAME: "${APP_NAME:-RestoMaster}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      # Coolify inyecta automáticamente SERVICE_FQDN_APP si defines un dominio en la UI
      APP_URL: "${SERVICE_FQDN_APP:-${APP_URL:-http://localhost:8004}}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      # Conexión Base de Datos PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-restomaster}"
      DB_USERNAME: "${DB_USERNAME:-adminresto}"
      DB_PASSWORD: "${DB_PASSWORD:-SecretResto2026!}"

      # Control de Sesiones, Colas y Caché (database/file para VPS ligero y estable)
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      CACHE_STORE: "${CACHE_STORE:-file}"

      # Automatización en el arranque del contenedor
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      AUTO_SEED: "${AUTO_SEED:-true}"
      DEMO_USERS_PASSWORD: "${DEMO_USERS_PASSWORD:-password}"
      OPTIMIZE_CACHE: "${OPTIMIZE_CACHE:-true}"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_public:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restomaster_net
    labels:
      - "coolify.managed=true"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      # Expuesto solo en localhost del VPS para evitar riesgos de seguridad externa
      - "${POSTGRES_EXTERNAL_PORT:-127.0.0.1:5434}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-restomaster}"
      POSTGRES_USER: "${DB_USERNAME:-adminresto}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-SecretResto2026!}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-adminresto} -d ${DB_DATABASE:-restomaster}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - restomaster_net
    labels:
      - "coolify.managed=true"

volumes:
  postgres_data:
    name: restomaster_postgres_data
  storage_app:
    name: restomaster_storage_app
  storage_public:
    name: restomaster_storage_public
  storage_logs:
    name: restomaster_storage_logs

networks:
  restomaster_net:
    name: restomaster_network
    driver: bridge
